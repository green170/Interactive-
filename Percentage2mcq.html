<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pschoolbd - শতক (Percentage) Quiz</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:0 10px 40px;
  font-family:"Noto Sans Bengali","Noto Sans",Arial,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#fff7ed);
  color:#222;
}

/* ================= TOP STICKY BAR ================= */

.topbar{
  position:sticky;
  top:0;
  z-index:9999;
  width:100%;
  background:linear-gradient(135deg,#1261a0,#174f7d);
  color:white;
  text-align:center;
  padding:7px 10px;
  box-shadow:0 3px 14px rgba(0,0,0,.25);
}

.brand{
  font-size:18px;
  font-weight:900;
  line-height:1.2;
}

.timer-box{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:3px;
  padding:4px 15px;
  border-radius:20px;
  background:rgba(255,255,255,.15);
}

.timer-label{
  font-size:13px;
  font-weight:700;
}

#timer{
  font-size:23px;
  font-weight:900;
  letter-spacing:1px;
  line-height:1;
}

#timer.warning{
  color:#ffe066;
}

#timer.danger{
  color:#ff8787;
  animation:blink .7s infinite;
}

@keyframes blink{
  50%{opacity:.45}
}


/* ================= MAIN CARD ================= */

.card{
  width:min(700px,100%);
  margin:16px auto;
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 6px 25px rgba(0,0,0,.12);
}

h1{
  text-align:center;
  margin:3px 0 8px;
  color:#1261a0;
  font-size:29px;
}

.subtitle{
  text-align:center;
  color:#667085;
  margin:0 0 20px;
  font-size:15px;
}


/* ================= QUESTIONS ================= */

.q{
  border:1px solid #dce4ec;
  border-radius:15px;
  padding:15px;
  margin:15px 0;
  background:#fafcff;
}

.q h3{
  margin:0 0 12px;
  color:#172033;
  font-size:18px;
  line-height:1.55;
}

label{
  display:block;
  padding:11px 12px;
  margin:8px 0;
  background:#fff;
  border:1px solid #d8e0e8;
  border-radius:10px;
  cursor:pointer;
  transition:.15s;
}

label:hover{
  background:#eef7ff;
  border-color:#1261a0;
}

label:has(input:checked){
  background:#e5f2ff;
  border-color:#1261a0;
  font-weight:700;
}

input{
  margin-right:8px;
  accent-color:#1261a0;
}


/* ================= SUBMIT ================= */

.submit-btn{
  width:100%;
  padding:15px;
  margin-top:8px;
  border:0;
  border-radius:13px;
  background:#1261a0;
  color:#fff;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(18,97,160,.25);
}

.submit-btn:hover{
  background:#0d4f85;
}

.submit-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}


/* ================= RESULT ================= */

#result{
  display:none;
  margin-top:20px;
  padding:18px;
  border-radius:15px;
  background:#eef8ee;
  border:1px solid #cce5cc;
}

#result h2{
  margin-top:0;
  color:#1261a0;
}

.correct{
  color:#17803d;
  font-weight:700;
}

.wrong{
  color:#c62828;
  font-weight:700;
}

hr{
  border:0;
  border-top:1px solid #d5e5d5;
}


/* ================= POPUP ================= */

.popup-overlay{
  position:fixed;
  inset:0;
  z-index:10000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.58);
}

.popup-overlay.show{
  display:flex;
}

.popup{
  width:min(410px,100%);
  background:#fff;
  border-radius:22px;
  padding:25px 20px;
  text-align:center;
  box-shadow:0 15px 50px rgba(0,0,0,.35);
  animation:popupIn .2s ease;
}

.popup-icon{
  font-size:48px;
}

.popup h2{
  margin:8px 0;
  color:#1261a0;
}

.popup p{
  color:#555;
  line-height:1.65;
  margin-bottom:18px;
}

.popup button{
  border:0;
  border-radius:11px;
  padding:11px 25px;
  background:#1261a0;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

@keyframes popupIn{
  from{
    transform:scale(.82);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}


/* ================= MOBILE ================= */

@media(max-width:520px){

  body{
    padding:0 7px 30px;
  }

  .card{
    padding:14px;
    margin-top:12px;
    border-radius:17px;
  }

  h1{
    font-size:24px;
  }

  .q{
    padding:12px;
  }

  .q h3{
    font-size:16px;
  }

  label{
    font-size:15px;
  }

  #timer{
    font-size:22px;
  }
}
</style>
</head>


<body>


<!-- ================= STICKY HEADER ================= -->

<div class="topbar">

  <div class="brand">
    📚 Pschoolbd
  </div>

  <div class="timer-box">

    <span class="timer-label">
      ⏳ সময় বাকি
    </span>

    <span id="timer">
      07:00
    </span>

  </div>

</div>
