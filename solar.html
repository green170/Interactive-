<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>pschoolbd | 3D Solar System</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  overflow:hidden;
  background:#020617;
  color:white;
  font-family:Arial,sans-serif;
}

#app{
  width:100vw;
  height:100vh;
}

.header{
  position:fixed;
  top:15px;
  left:0;
  width:100%;
  text-align:center;
  z-index:10;
  pointer-events:none;
}

.header h1{
  margin:0;
  font-size:32px;
}

.header p{
  margin:6px 0;
  opacity:.75;
}

.brand{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:10;
  font-weight:bold;
  opacity:.7;
}

.hint{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:#ffffff15;
  border:1px solid #ffffff30;
  padding:9px 15px;
  border-radius:20px;
  z-index:10;
  font-size:13px;
}

.info{
  display:none;
  position:fixed;
  top:80px;
  right:18px;
  width:300px;
  padding:18px;
  border-radius:18px;
  background:#07111eeF;
  border:1px solid #ffffff35;
  backdrop-filter:blur(12px);
  z-index:20;
}

.info.show{
  display:block;
}

.info h2{
  margin-top:0;
}

.close{
  float:right;
  border:0;
  background:#ffffff20;
  color:white;
  width:30px;
  height:30px;
  border-radius:50%;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="app"></div>

<div class="header">
  <h1>🌌 সৌরজগত</h1>
  <p>Interactive 3D Solar System</p>
</div>

<div class="hint">
  👆 গ্রহে ক্লিক করুন • 🖱️ Drag করুন • 🔍 Zoom করুন
</div>

<div class="brand">
  pschoolbd
</div>

<div id="info" class="info">
  <button class="close" onclick="closeInfo()">×</button>
  <h2 id="planetName"></h2>
  <p id="planetInfo"></p>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import {OrbitControls} from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';


// =========================
// SCENE
// =========================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020617);


// =========================
// CAMERA
// =========================

const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  0.1,
  200
);

camera.position.set(0,15,32);


// =========================
// RENDERER
// =========================

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document
  .getElementById("app")
  .appendChild(renderer.domElement);


// =========================
// CAMERA CONTROLS
// =========================

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;

controls.minDistance = 7;

controls.maxDistance = 70;


// =========================
// LIGHT
// =========================

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    1
  )
);

const sunLight =
  new THREE.PointLight(
    0xffffff,
    5,
    0
  );

scene.add(sunLight);


// =========================
// SPHERE FUNCTION
// =========================

function createPlanet(
  radius,
  color,
  glow = 0x000000
){

  const material =
    new THREE.MeshStandardMaterial({
      color:color,
      roughness:.8,
      emissive:glow,
      emissiveIntensity:1
    });

  const geometry =
    new THREE.SphereGeometry(
      radius,
      32,
      32
    );

  return new THREE.Mesh(
    geometry,
    material
  );
}


// =========================
// SUN
// =========================

const sun =
  createPlanet(
    2.4,
    0xffaa00,
    0xff6600
  );

sun.userData = {
  name:"সূর্য",
  info:"সূর্য হলো সৌরজগতের কেন্দ্রীয় নক্ষত্র।"
};

scene.add(sun);


// =========================
// PLANETS
// =========================

const planetsData = [

  {
    name:"বুধ",
    radius:.55,
    distance:4.2,
    color:0xaaaaaa,
    speed:.0010,
    info:"বুধ হলো সূর্যের সবচেয়ে কাছের গ্রহ।"
  },

  {
    name:"শুক্র",
    radius:.75,
    distance:6,
    color:0xe0bd78,
    speed:.0007,
    info:"শুক্র সৌরজগতের অন্যতম উষ্ণ গ্রহ।"
  },

  {
    name:"পৃথিবী",
    radius:.82,
    distance:8,
    color:0x287be8,
    speed:.0005,
    info:"পৃথিবী আমাদের বাসস্থান এবং এখানে প্রাণের অস্তিত্ব রয়েছে।"
  },

  {
    name:"মঙ্গল",
    radius:.68,
    distance:10,
    color:0xc14432,
    speed:.0004,
    info:"মঙ্গলকে লাল গ্রহ বলা হয়।"
  },

  {
    name:"বৃহস্পতি",
    radius:1.55,
    distance:13,
    color:0xd6a06a,
    speed:.00018,
    info:"বৃহস্পতি সৌরজগতের সবচেয়ে বড় গ্রহ।"
  },

  {
    name:"শনি",
    radius:1.3,
    distance:16,
    color:0xd8c18a,
    speed:.00014,
    info:"শনির চারপাশে একটি সুন্দর বলয় রয়েছে।"
  },

  {
    name:"ইউরেনাস",
    radius:1.02,
    distance:19,
    color:0x76d7e8,
    speed:.00010,
    info:"ইউরেনাস একটি বরফ দৈত্য গ্রহ।"
  },

  {
    name:"নেপচুন",
    radius:1,
    distance:22,
    color:0x4169e1,
    speed:.00008,
    info:"নেপচুন হলো সূর্য থেকে সবচেয়ে দূরের গ্রহ।"
  }

];


// =========================
// CREATE PLANETS
// =========================

const planets = [];

planetsData.forEach(data => {

  const orbit =
    new THREE.Object3D();

  scene.add(orbit);


  const planet =
    createPlanet(
      data.radius,
      data.color
    );

  planet.position.x =
    data.distance;

  planet.userData = data;

  orbit.add(planet);


  // Orbit line

  const ring =
    new THREE.Mesh(

      new THREE.RingGeometry(
        data.distance - .012,
        data.distance + .012,
        128
      ),

      new THREE.MeshBasicMaterial({
        color:0xffffff,
        transparent:true,
        opacity:.15,
        side:THREE.DoubleSide
      })

    );

  ring.rotation.x =
    Math.PI / 2;

  scene.add(ring);


  // Planet label

  const canvas =
    document.createElement("canvas");

  canvas.width = 400;
  canvas.height = 100;

  const ctx =
    canvas.getContext("2d");

  ctx.font =
    "bold 38px Arial";

  ctx.fillStyle =
    "white";

  ctx.textAlign =
    "center";

  ctx.fillText(
    data.name,
    200,
    60
  );


  const texture =
    new THREE.CanvasTexture(canvas);

  const label =
    new THREE.Sprite(
      new THREE.SpriteMaterial({
        map:texture,
        transparent:true
      })
    );

  label.scale.set(
    3.5,
    .9,
    1
  );

  label.position.y =
    data.radius + 1;

  planet.add(label);


  // Saturn ring

  if(data.name === "শনি"){

    const saturnRing =
      new THREE.Mesh(

        new THREE.RingGeometry(
          1.7,
          2.5,
          64
        ),

        new THREE.MeshBasicMaterial({
          color:0xd8c18a,
          transparent:true,
          opacity:.8,
          side:THREE.DoubleSide
        })

      );

    saturnRing.rotation.x =
      Math.PI / 2.4;

    planet.add(saturnRing);
  }


  planets.push({
    planet,
    orbit,
    speed:data.speed
  });

});


// =========================
// STARS
// =========================

const starGeometry =
  new THREE.BufferGeometry();

const starPositions = [];

for(let i=0;i<2500;i++){

  starPositions.push(
    (Math.random()-.5)*160,
    (Math.random()-.5)*160,
    (Math.random()-.5)*160
  );

}

starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(
    starPositions,
    3
  )
);

const stars =
  new THREE.Points(
    starGeometry,
    new THREE.PointsMaterial({
      color:0xffffff,
      size:.08
    })
  );

scene.add(stars);


// =========================
// CLICK INTERACTION
// =========================

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();

renderer.domElement
.addEventListener(
  "pointerdown",
  event => {

    mouse.x =
      (event.clientX /
      window.innerWidth) * 2 - 1;

    mouse.y =
      -(event.clientY /
      window.innerHeight) * 2 + 1;


    raycaster.setFromCamera(
      mouse,
      camera
    );


    const objects =
      planets.map(
        p => p.planet
      );

    const hits =
      raycaster.intersectObjects(
        objects
      );


    if(hits.length){

      const data =
        hits[0].object.userData;

      document.getElementById(
        "planetName"
      ).textContent =
        data.name;

      document.getElementById(
        "planetInfo"
      ).textContent =
        data.info;

      document.getElementById(
        "info"
      ).classList.add("show");

    }

  }
);


// =========================
// CLOSE CARD
// =========================

window.closeInfo =
function(){

  document
    .getElementById("info")
    .classList.remove("show");

};


// =========================
// ANIMATION
// =========================

function animate(){

  requestAnimationFrame(
    animate
  );


  // Sun rotation

  sun.rotation.y += .002;


  // Planet rotation + orbit

  planets.forEach(p => {

    p.orbit.rotation.y +=
      p.speed;

    p.planet.rotation.y +=
      .01;

  });


  controls.update();

  renderer.render(
    scene,
    camera
  );

}

animate();


// =========================
// RESIZE
// =========================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
