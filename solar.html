<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>pschoolbd | সৌরজগত</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    overflow:hidden;
    background:#020516;
    color:white;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
}

#app{
    width:100vw;
    height:100vh;
}

.header{
    position:fixed;
    top:12px;
    left:0;
    width:100%;
    text-align:center;
    z-index:10;
    pointer-events:none;
}

.header h1{
    margin:0;
    font-size:clamp(30px,8vw,55px);
    font-weight:800;
    text-shadow:0 0 15px #ffffff55;
}

.header p{
    margin:5px 0;
    font-size:18px;
    font-style:italic;
    font-weight:bold;
    opacity:.85;
}

.brand{
    position:fixed;
    right:18px;
    bottom:18px;
    font-size:20px;
    font-weight:bold;
    font-style:italic;
    opacity:.75;
    z-index:10;
}

.hint{
    position:fixed;
    bottom:70px;
    left:50%;
    transform:translateX(-50%);
    width:max-content;
    max-width:90%;
    text-align:center;
    background:#171b2ee8;
    border:1px solid #ffffff35;
    border-radius:30px;
    padding:12px 20px;
    font-size:15px;
    z-index:10;
}

.info{
    position:fixed;
    top:85px;
    right:15px;
    width:300px;
    max-width:calc(100% - 30px);
    padding:20px;
    background:#080d1cf5;
    border:1px solid #ffffff40;
    border-radius:20px;
    z-index:30;
    display:none;
    backdrop-filter:blur(12px);
    box-shadow:0 10px 40px #0008;
}

.info.show{
    display:block;
}

.info h2{
    margin:0 0 10px;
    font-size:26px;
}

.info p{
    line-height:1.6;
}

.close{
    position:absolute;
    top:10px;
    right:10px;
    width:32px;
    height:32px;
    border:0;
    border-radius:50%;
    background:#ffffff20;
    color:white;
    font-size:20px;
}
</style>
</head>

<body>

<div id="app"></div>

<div class="header">
    <h1>🌌 সৌরজগত</h1>
    <p>Interactive 3D Solar System</p>
</div>

<div class="hint">
    👆 গ্রহে ক্লিক করুন • 🖱️ Drag করুন • 🔍 Zoom করুন
</div>

<div class="brand">
    pschoolbd
</div>

<div id="info" class="info">
    <button class="close" onclick="closeInfo()">×</button>
    <h2 id="planetName"></h2>
    <p id="planetText"></p>
</div>


<!-- Three.js Import Map -->
<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";


// ===============================
// SCENE
// ===============================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020516);


// ===============================
// CAMERA
// ===============================

const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    300
);

camera.position.set(0,16,34);


// ===============================
// RENDERER
// ===============================

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document
.getElementById("app")
.appendChild(renderer.domElement);


// ===============================
// CONTROLS
// ===============================

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.05;

controls.minDistance = 7;
controls.maxDistance = 80;


// ===============================
// LIGHT
// ===============================

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        0.8
    )
);

const sunLight =
    new THREE.PointLight(
        0xffffff,
        6,
        0
    );

scene.add(sunLight);


// ===============================
// STAR FIELD
// ===============================

const starGeometry =
    new THREE.BufferGeometry();

const starArray = [];

for(let i=0;i<3500;i++){

    starArray.push(
        (Math.random()-0.5)*220,
        (Math.random()-0.5)*220,
        (Math.random()-0.5)*220
    );

}

starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        starArray,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({
        color:0xffffff,
        size:0.08
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);


// ===============================
// SPHERE FUNCTION
// ===============================

function makeSphere(
    radius,
    color,
    emissive=0x000000
){

    const geometry =
        new THREE.SphereGeometry(
            radius,
            40,
            40
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.75,
            metalness:.05,
            emissive:emissive,
            emissiveIntensity:1
        });

    return new THREE.Mesh(
        geometry,
        material
    );
}


// ===============================
// SUN
// ===============================

const sun =
    makeSphere(
        2.5,
        0xffaa00,
        0xff5500
    );

scene.add(sun);


// Sun glow

const glowGeometry =
    new THREE.SphereGeometry(
        2.8,
        32,
        32
    );

const glowMaterial =
    new THREE.MeshBasicMaterial({
        color:0xff9900,
        transparent:true,
        opacity:.12
    });

const glow =
    new THREE.Mesh(
        glowGeometry,
        glowMaterial
    );

scene.add(glow);


// ===============================
// PLANET DATA
// ===============================

const planetData = [

{
    name:"বুধ",
    radius:.55,
    distance:4.5,
    color:0xaaaaaa,
    orbitSpeed:.010,
    info:"বুধ হলো সূর্যের সবচেয়ে কাছের গ্রহ।"
},

{
    name:"শুক্র",
    radius:.75,
    distance:6.5,
    color:0xd8a95b,
    orbitSpeed:.007,
    info:"শুক্র সৌরজগতের একটি অত্যন্ত উষ্ণ গ্রহ।"
},

{
    name:"পৃথিবী",
    radius:.85,
    distance:8.5,
    color:0x287be8,
    orbitSpeed:.005,
    info:"পৃথিবী আমাদের বাসস্থান। এখানে পানি ও প্রাণের অস্তিত্ব রয়েছে।"
},

{
    name:"মঙ্গল",
    radius:.68,
    distance:10.5,
    color:0xc94b35,
    orbitSpeed:.004,
    info:"মঙ্গলকে লাল গ্রহ বলা হয়।"
},

{
    name:"বৃহস্পতি",
    radius:1.55,
    distance:13.5,
    color:0xd49b6a,
    orbitSpeed:.002,
    info:"বৃহস্পতি সৌরজগতের সবচেয়ে বড় গ্রহ।"
},

{
    name:"শনি",
    radius:1.3,
    distance:17,
    color:0xd8c18a,
    orbitSpeed:.0015,
    info:"শনি তার সুন্দর বলয়ের জন্য বিখ্যাত।"
},

{
    name:"ইউরেনাস",
    radius:1.0,
    distance:20.5,
    color:0x71d5df,
    orbitSpeed:.001,
    info:"ইউরেনাস একটি বরফ দৈত্য গ্রহ।"
},

{
    name:"নেপচুন",
    radius:1.0,
    distance:24,
    color:0x4169e1,
    orbitSpeed:.0008,
    info:"নেপচুন হলো সূর্য থেকে সবচেয়ে দূরের গ্রহ।"
}

];


// ===============================
// CREATE PLANETS
// ===============================

const planets = [];

planetData.forEach(data=>{

    // Orbit container

    const orbit =
        new THREE.Object3D();

    scene.add(orbit);


    // Planet

    const planet =
        makeSphere(
            data.radius,
            data.color
        );

    planet.position.x =
        data.distance;

    planet.userData = data;

    orbit.add(planet);


    // ===========================
    // ORBIT LINE
    // ===========================

    const orbitGeometry =
        new THREE.RingGeometry(
            data.distance-.015,
            data.distance+.015,
            160
        );

    const orbitMaterial =
        new THREE.MeshBasicMaterial({
            color:0xffffff,
            transparent:true,
            opacity:.16,
            side:THREE.DoubleSide
        });

    const orbitRing =
        new THREE.Mesh(
            orbitGeometry,
            orbitMaterial
        );

    orbitRing.rotation.x =
        Math.PI/2;

    scene.add(orbitRing);


    // ===========================
    // LABEL
    // ===========================

    const canvas =
        document.createElement("canvas");

    canvas.width = 500;
    canvas.height = 120;

    const ctx =
        canvas.getContext("2d");

    ctx.font =
        "bold 46px Arial";

    ctx.fillStyle =
        "#ffffff";

    ctx.textAlign =
        "center";

    ctx.shadowColor =
        "#000000";

    ctx.shadowBlur = 8;

    ctx.fillText(
        data.name,
        250,
        70
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    const label =
        new THREE.Sprite(
            new THREE.SpriteMaterial({
                map:texture,
                transparent:true
            })
        );

    label.scale.set(
        4,
        .95,
        1
    );

    label.position.y =
        data.radius+1.1;

    planet.add(label);


    // ===========================
    // SATURN RING
    // ===========================

    if(data.name==="শনি"){

        const ringGeometry =
            new THREE.RingGeometry(
                1.65,
                2.55,
                80
            );

        const ringMaterial =
            new THREE.MeshBasicMaterial({
                color:0xd7c18a,
                transparent:true,
                opacity:.85,
                side:THREE.DoubleSide
            });

        const saturnRing =
            new THREE.Mesh(
                ringGeometry,
                ringMaterial
            );

        saturnRing.rotation.x =
            Math.PI/2.4;

        planet.add(
            saturnRing
        );
    }


    planets.push({
        planet:planet,
        orbit:orbit,
        speed:data.orbitSpeed
    });

});


// ===============================
// CLICK SYSTEM
// ===============================

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


renderer.domElement.addEventListener(
    "pointerdown",
    event=>{

        mouse.x =
            (event.clientX /
            window.innerWidth)*2-1;

        mouse.y =
            -(event.clientY /
            window.innerHeight)*2+1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const objects =
            planets.map(
                item=>item.planet
            );


        const hits =
            raycaster.intersectObjects(
                objects
            );


        if(hits.length){

            const data =
                hits[0]
                .object
                .userData;


            document
            .getElementById(
                "planetName"
            )
            .textContent =
                data.name;


            document
            .getElementById(
                "planetText"
            )
            .textContent =
                data.info;


            document
            .getElementById(
                "info"
            )
            .classList.add(
                "show"
            );

        }

    }
);


// ===============================
// CLOSE
// ===============================

window.closeInfo =
function(){

    document
    .getElementById("info")
    .classList.remove(
        "show"
    );

};


// ===============================
// ANIMATION
// ===============================

function animate(){

    requestAnimationFrame(
        animate
    );


    // Sun rotation

    sun.rotation.y += .003;

    glow.rotation.y += .002;


    // Planet orbit + rotation

    planets.forEach(item=>{

        item.orbit.rotation.y +=
            item.speed;

        item.planet.rotation.y +=
            .012;

    });


    // Stars slowly rotate

    stars.rotation.y +=
        .00008;


    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();


// ===============================
// RESIZE
// ===============================

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
