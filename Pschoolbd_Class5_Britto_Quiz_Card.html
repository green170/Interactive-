<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pschoolbd — Class 5 বৃত্ত Quiz Card</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:linear-gradient(135deg,#eaf7ff,#fff5e8);font-family:Arial,"Noto Sans Bengali",sans-serif;color:#17324d}
.card{max-width:760px;margin:auto;background:white;border-radius:24px;overflow:hidden;box-shadow:0 8px 28px #0002}
.head{text-align:center;padding:20px;background:linear-gradient(135deg,#dff3ff,#f3edff)}
.brand{font-size:22px;font-weight:900;color:#126b3a}
h1{margin:7px 0 3px;font-size:28px}
.sub{color:#667789}
.content{padding:16px}
.topic{background:#f5fbff;border:1px solid #d8eaf6;border-radius:16px;padding:13px;text-align:center;margin-bottom:15px}
.quizTitle{font-size:21px;font-weight:900;margin:10px 0 14px;text-align:center}
.q{padding:13px;margin:12px 0;border:1px solid #dfebf2;border-radius:15px;background:#fbfdff}
.q p{margin:0 0 9px;font-weight:800}
.opt{display:block;padding:9px 10px;margin:6px 0;border-radius:10px;background:#f2f7fb}
.opt input{margin-right:8px}
.submit{width:100%;padding:14px;border:0;border-radius:14px;background:#17324d;color:#fff;font-size:17px;font-weight:900;margin-top:8px}
#result{display:none;margin-top:18px;padding:16px;border-radius:18px;background:#f4fbf6;border:1px solid #bfe6cd}
.score{font-size:30px;font-weight:900;text-align:center}
.review{margin-top:10px;padding:10px;border-radius:10px}
.correct{background:#e8f7ee}
.wrong{background:#fff0f0}
.footer{text-align:center;padding:12px;color:#718091;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="brand">Pschoolbd</div>
    <h1>⭕ বৃত্ত</h1>
    <div class="sub">Class 5 Mathematics</div>
  </div>

  <div class="content">
    <div class="topic">
      📚 <b>বৃত্ত — কেন্দ্র, ব্যাসার্ধ, ব্যাস ও জ্যা</b><br>
      নিচের ১০টি MCQ-এর প্রতিটির একটি উত্তর নির্বাচন করো।
    </div>

    <div class="quizTitle">🧠 ১০টি MCQ Quiz</div>
    <form id="quiz"></form>
    <button class="submit" type="button" onclick="submitQuiz()">✅ Submit Quiz</button>

    <div id="result"></div>
  </div>

  <div class="footer">Pschoolbd</div>
</div>

<script>
const questions=[
["বৃত্তের মাঝখানের নির্দিষ্ট বিন্দুকে কী বলে?",["কেন্দ্র","ব্যাস","জ্যা","পরিধি"],0],
["কেন্দ্র থেকে পরিধির যেকোনো বিন্দু পর্যন্ত রেখাংশকে কী বলে?",["জ্যা","ব্যাসার্ধ","ব্যাস","পরিধি"],1],
["কেন্দ্রের মধ্য দিয়ে অতিক্রমকারী জ্যাকে কী বলা হয়?",["ব্যাস","ব্যাসার্ধ","পরিধি","চাপ"],0],
["বৃত্তের দুইটি পরিধিবিন্দুকে যুক্ত করা রেখাংশকে কী বলে?",["কেন্দ্র","ব্যাসার্ধ","জ্যা","পরিধি"],2],
["একটি ব্যাসার্ধের তুলনায় ব্যাস কত গুণ?",["১ গুণ","২ গুণ","৩ গুণ","৪ গুণ"],1],
["বৃত্তের চারপাশের বাঁকা সীমারেখাকে কী বলে?",["কেন্দ্র","জ্যা","পরিধি","ব্যাস"],2],
["একটি বৃত্তের সব ব্যাসার্ধের দৈর্ঘ্য কেমন?",["সব সমান","সব আলাদা","শুধু দুটি সমান","কোনোটিই নয়"],0],
["ব্যাস ১০ সেমি হলে ব্যাসার্ধ কত?",["২ সেমি","৫ সেমি","১০ সেমি","২০ সেমি"],1],
["ব্যাসার্ধ ৬ সেমি হলে ব্যাস কত?",["৩ সেমি","৬ সেমি","১২ সেমি","১৮ সেমি"],2],
["নিচের কোনটি কেন্দ্রের মধ্য দিয়ে যায়?",["জ্যা","ব্যাস","পরিধি","ব্যাসার্ধ"],1]
];

const quiz=document.getElementById("quiz");
questions.forEach((q,qi)=>{
  const box=document.createElement("div");
  box.className="q";
  box.innerHTML="<p>"+(qi+1)+". "+q[0]+"</p>";
  q[1].forEach((a,i)=>{
    const label=document.createElement("label");
    label.className="opt";
    label.innerHTML='<input type="radio" name="q'+qi+'" value="'+i+'"> '+String.fromCharCode(65+i)+". "+a;
    box.appendChild(label);
  });
  quiz.appendChild(box);
});

function submitQuiz(){
  let score=0,answered=0,review="";
  questions.forEach((q,qi)=>{
    const chosen=document.querySelector('input[name="q'+qi+'"]:checked');
    const selected=chosen?Number(chosen.value):-1;
    if(chosen) answered++;
    if(selected===q[2]) score++;
    review+=
      '<div class="review '+(selected===q[2]?"correct":"wrong")+'">'+
      '<b>'+(qi+1)+". "+q[0]+"</b><br>"+
      "আপনার উত্তর: <b>"+(selected>=0?q[1][selected]:"উত্তর দেননি")+"</b><br>"+
      "সঠিক উত্তর: <b>"+q[1][q[2]]+"</b></div>";
  });

  document.querySelectorAll("#quiz input").forEach(x=>x.disabled=true);
  document.querySelector(".submit").disabled=true;
  document.querySelector(".submit").style.opacity=".55";

  const percent=score*10;
  const result=document.getElementById("result");
  result.style.display="block";
  result.innerHTML=
    '<div class="score">🎉 '+score+' / 10</div>'+
    '<p style="text-align:center"><b>প্রাপ্ত নম্বর: '+score+' | শতকরা: '+percent+'%</b><br>'+
    'উত্তর দিয়েছেন: '+answered+' / 10</p>'+
    '<hr><b>📋 উত্তর পর্যালোচনা</b>'+review;
  result.scrollIntoView({behavior:"smooth",block:"start"});
}
</script>
</body>
</html>
